name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Debug info
        run: |
          echo "Node:" && node -v
          echo "NPM:" && npm -v
          echo "VuePress:" && npx vuepress --version 2>&1 || true
          echo "=== @vuepress ===" && ls node_modules/@vuepress/ 2>/dev/null || echo "NONE"
          echo "=== File tree ===" && find docs -type f | sort

      - name: Build VuePress site
        run: npx vuepress build docs 2>&1
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
