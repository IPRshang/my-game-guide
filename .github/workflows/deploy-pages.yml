name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Debug — List files and check env
        run: |
          echo "=== Node version ==="
          node -v
          echo "=== NPM version ==="
          npm -v
          echo "=== VuePress version ==="
          npx vuepress --version || true
          echo "=== Installed @vuepress packages ==="
          ls node_modules/@vuepress/ || true
          echo "=== Docs directory structure ==="
          find docs -type f | head -50
          echo "=== Check .vuepress ==="
          ls -la docs/.vuepress/ || true

      - name: Build VuePress site (with verbose output)
        run: |
          npx vuepress build docs 2>&1 | tee build.log || { echo "BUILD FAILED"; cat build.log; exit 1; }
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
