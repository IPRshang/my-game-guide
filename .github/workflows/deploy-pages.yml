name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Debug info
        run: |
          echo "=== Node ===" && node -v
          echo "=== NPM ===" && npm -v
          echo "=== VuePress version ===" && npx vuepress --version || true
          echo "=== @vuepress packages ===" && ls node_modules/@vuepress/ 2>/dev/null || echo "NONE"
          echo "=== vuepress deps ===" && ls node_modules/vuepress/node_modules/@vuepress/ 2>/dev/null || echo "NONE"
          echo "=== Total packages ===" && ls node_modules/ | wc -l
          echo "=== .bin ===" && ls node_modules/.bin/vuepress* 2>/dev/null || echo "NOT FOUND"
          echo "=== Docs tree ===" && find docs -type f | sort

      - name: Build VuePress site (verbose)
        run: |
          set -x
          npx vuepress build docs --debug 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          echo "EXIT CODE: $EXIT"
          if [ $EXIT -ne 0 ]; then
            echo "=== Last 200 lines of build output ==="
            tail -200 /tmp/build.log
            exit $EXIT
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
