<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Game controller icon -->
  <g transform="translate(600,180)" fill="none" stroke="url(#accent)" stroke-width="4">
    <rect x="-100" y="-30" width="200" height="60" rx="10"/>
    <circle cx="-130" cy="0" r="25"/>
    <circle cx="130" cy="0" r="25"/>
    <line x1="-100" y1="-30" x2="-130" y2="0"/>
    <line x1="100" y1="-30" x2="130" y2="0"/>
  </g>

  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">
    Game Strategy Hub
  </text>
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#ccc">
    热门游戏攻略站
  </text>

  <!-- Divider -->
  <line x1="100" y1="380" x2="1100" y2="380" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>

  <!-- Game titles -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#aaa">
    GTA6 · Black Myth Wukong · Elden Ring · Cyberpunk 2077 · Zelda: TotK
  </text>

  <!-- Footer -->
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#666">
    iprshang.github.io/my-game-guide · Free · No Ads · Bilingual
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
