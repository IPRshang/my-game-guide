<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾尔登法环 — 交互式Boss & 收集品地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#1a1a2e; color:#e0e0e0; }
#map-container { width:100vw; height:100vh; position:relative; }
#map { width:100%; height:100%; background:#0d1117; }
#panel { position:absolute; top:10px; right:10px; z-index:1000; background:rgba(22,27,34,0.95); border-radius:12px; padding:16px; width:280px; max-height:calc(100vh - 40px); overflow-y:auto; border:1px solid #30363d; backdrop-filter:blur(10px); }
#panel h2 { font-size:16px; margin-bottom:12px; color:#f0c040; text-align:center; border-bottom:1px solid #30363d; padding-bottom:8px; }
.cat-btn { display:block; width:100%; padding:8px 12px; margin:4px 0; background:#21262d; color:#c9d1d9; border:1px solid #30363d; border-radius:6px; cursor:pointer; text-align:left; font-size:13px; transition:all 0.2s; }
.cat-btn:hover { background:#30363d; border-color:#f0c040; }
.cat-btn.active { background:#f0c04022; border-color:#f0c040; color:#f0c040; }
.legend { margin-top:12px; padding-top:8px; border-top:1px solid #30363d; }
.legend-item { display:flex; align-items:center; gap:8px; font-size:12px; margin:4px 0; }
.legend-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; border:2px solid rgba(255,255,255,0.5); }
.leaflet-popup-content-wrapper { background:#161b22; color:#c9d1d9; border:1px solid #30363d; border-radius:8px; }
.leaflet-popup-tip { background:#161b22; }
.leaflet-popup-content { margin:10px 14px; font-size:13px; line-height:1.6; }
.leaflet-popup-content strong { color:#f0c040; }
.leaflet-control-zoom a { background:#21262d; color:#c9d1d9; border-color:#30363d; }
.leaflet-control-zoom a:hover { background:#30363d; }
.leaflet-control-attribution { background:rgba(22,27,34,0.8); color:#8b949e; font-size:10px; }
.leaflet-control-attribution a { color:#58a6ff; }
@media (max-width:600px) {
  #panel { width:220px; padding:12px; font-size:12px; }
}
</style>
</head>
<body>
<div id="map-container">
  <div id="map"></div>
  <div id="panel">
    <h2>艾尔登法环 交互地图</h2>
    <button class="cat-btn active" onclick="filterMarkers('all')">全部显示</button>
    <button class="cat-btn" onclick="filterMarkers('boss')">主线Boss (12个)</button>
    <button class="cat-btn" onclick="filterMarkers('optional')">可选Boss (6个)</button>
    <button class="cat-btn" onclick="filterMarkers('golden')">黄金种子 (8处)</button>
    <button class="cat-btn" onclick="filterMarkers('tear')">圣杯露滴 (6处)</button>
    <button class="cat-btn" onclick="filterMarkers('merchant')">流浪商人 (5处)</button>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#ff4444"></span> 主线Boss</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ff8800"></span> 可选Boss</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ffdd00"></span> 黄金种子</div>
      <div class="legend-item"><span class="legend-dot" style="background:#44aaff"></span> 圣杯露滴</div>
      <div class="legend-item"><span class="legend-dot" style="background:#88cc88"></span> 流浪商人</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Custom CRS for game map (flat image, not Earth projection)
var map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 3,
  zoomControl: true,
  attributionControl: true
});

// Bounds of the game world map image (pixel dimensions 4096x3072)
var bounds = [[0,0], [3072,4096]];
map.setView([1536, 2048], -1);

// Dark theme canvas tile
L.tileLayer('', {}).addTo(map);

// Draw a dark background
var bg = L.rectangle(bounds, {color:'#1a2a1a', weight:0, fillColor:'#1a2a1a', fillOpacity:1}).addTo(map);

// --- Map data ---
var markers = [];

// Helper to add labeled marker
function addMarker(x, y, category, title, desc, level) {
  var colors = {
    'boss': '#ff4444',
    'optional': '#ff8800', 
    'golden': '#ffdd00',
    'tear': '#44aaff',
    'merchant': '#88cc88'
  };
  var color = colors[category] || '#ffffff';
  
  var icon = L.divIcon({
    className: 'custom-marker',
    html: '<div style="background:'+color+';width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,0.6);box-shadow:0 0 8px '+color+';"></div>',
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });
  
  var lvlStr = level ? ' [Lv.' + level + ']' : '';
  var m = L.marker([y, x], {icon: icon, category: category})
    .bindPopup('<strong>'+title+'</strong>'+lvlStr+'<br>'+desc);
  markers.push(m);
}

// === MAIN BOSSES (red) ===
addMarker(1600, 600, 'boss', '恶兆 玛尔基特', '史东薇尔城门前的守门Boss。<br>弱点：出血、弹反<br>可召唤罗杰尔协助', '20-25');
addMarker(1750, 750, 'boss', '接肢 葛瑞克', '史东薇尔城主。<br>P2接龙头，火焰攻击低头可避', '30-35');
addMarker(1200, 500, 'boss', '满月女王 蕾娜菈', '魔法学院最终Boss。<br>P1打发光小女孩,P2法术战', '40-45');
addMarker(3200, 400, 'boss', '龙装大树守卫', '王城罗德尔入口。<br>骑马绕圈稳扎稳打', '60-65');
addMarker(3400, 600, 'boss', '葛孚雷(幻影)', '王城罗德尔内部。<br>招式大开大合，回避后反击', '70-75');
addMarker(3600, 550, 'boss', '恶兆王 蒙葛特', '王城王座。<br>玛尔基特的完全体+圣属性飞剑', '75-80');
addMarker(2800, 1200, 'boss', '火焰巨人', '巨人山顶。<br>骑马绕后攻击脚踝+P2攻击手腕', '85-90');
addMarker(3800, 1600, 'boss', '神皮双人组', '法则姆·阿兹拉。<br>双Boss共享血条，睡眠壶必备', '95-100');
addMarker(3900, 1800, 'boss', '黑剑 玛利喀斯', '法则姆·阿兹拉深处。<br>P2命定之死极其狂暴', '100-105');
addMarker(3300, 700, 'boss', '百智爵士 基甸', '灰烬王城。<br>法术大杂烩，近身爆发输出', '100-105');
addMarker(3450, 750, 'boss', '葛孚雷/荷莱·露', '灰烬王城。<br>P1斧头范围技,P2赤手摔跤', '105-110');
addMarker(3500, 850, 'boss', '拉达冈+艾尔登之兽', '黄金树内部(最终Boss)。<br>拉达冈弱火,艾尔登之兽弱物理', '110-120');

// === OPTIONAL BOSSES (orange) ===
addMarker(2500, 200, 'optional', '碎星 拉塔恩', '红狮子城。<br>史诗级Boss战，可召唤6NPC<br>弱猩红腐败', '55-60');
addMarker(4000, 2500, 'optional', '女武神 玛莲妮亚', '圣树底层(全游戏最难)。<br>水鸟乱舞三阶段闪避<br>回血机制注意', '120-130');
addMarker(1800, 2200, 'optional', '鲜血君王 蒙格', '蒙格温王朝。<br>必带净血结晶露', '90-100');
addMarker(2200, 1800, 'optional', '死龙 弗尔桑克斯', '深根底层。<br>蕾娜菈支线关联Boss', '80-90');
addMarker(500, 2000, 'optional', '熔炉骑士 ×2', '亚雷萨英雄墓地。<br>双熔炉骑士，逐个击败', '70-80');
addMarker(2600, 400, 'optional', '恶兆王种子', '王城外围小黄金树。<br>腐化树灵守门', '65-70');

// === GOLDEN SEEDS (yellow) ===
addMarker(1200, 400, 'golden', '黄金种子 #1', '宁姆格福 风暴山丘<br>小黄金树下');
addMarker(1800, 900, 'golden', '黄金种子 #2', '史东薇尔城 升降梯旁<br>小黄金树下');
addMarker(1000, 600, 'golden', '黄金种子 #3', '湖之利耶尼亚 学院门前<br>小黄金树下');
addMarker(3100, 300, 'golden', '黄金种子 #4', '王城外 幻影树<br>小黄金树下');
addMarker(3800, 300, 'golden', '黄金种子 #5', '巨人山顶 禁域<br>小黄金树下');
addMarker(3200, 1800, 'golden', '黄金种子 #6', '巨人山顶 安歇教堂<br>小黄金树下');
addMarker(4100, 1500, 'golden', '黄金种子 #7', '法则姆·阿兹拉<br>小黄金树下');
addMarker(3800, 2300, 'golden', '黄金种子 #8', '圣树 祈祷室<br>小黄金树下');

// === SACRED TEARS (blue) ===
addMarker(1400, 350, 'tear', '圣杯露滴 #1', '宁姆格福 巡礼教堂');
addMarker(1700, 650, 'tear', '圣杯露滴 #2', '史东薇尔城 升降梯旁教堂');
addMarker(950, 550, 'tear', '圣杯露滴 #3', '利耶尼亚 伊利斯教堂');
addMarker(3400, 500, 'tear', '圣杯露滴 #4', '王城 黄金树大教堂');
addMarker(3000, 1000, 'tear', '圣杯露滴 #5', '巨人山顶 玛莉卡第三教堂');
addMarker(3700, 1700, 'tear', '圣杯露滴 #6', '法则姆·阿兹拉 龙教堂');

// === WANDERING MERCHANTS (green) ===
addMarker(800, 300, 'merchant', '流浪商人 咖列', '宁姆格福 艾雷教堂<br>出售：火炬、望远镜、情报');
addMarker(600, 1500, 'merchant', '流浪商人(啜泣半岛)', '啜泣半岛 隐居商人的破屋<br>出售： lantern (提灯)');
addMarker(1500, 1200, 'merchant', '流浪商人(利耶尼亚)', '利耶尼亚 学院门前镇<br>出售：石剑钥匙×3');
addMarker(3400, 900, 'merchant', '流浪商人(王城)', '王城 大道旁<br>出售：各种消耗品');
addMarker(2600, 1600, 'merchant', '流浪商人(巨人山顶)', '巨人山顶 古遗迹雪原<br>出售：冰冻油脂配方');

// Add all markers to map
markers.forEach(function(m) { m.addTo(map); });

// Filter function
function filterMarkers(cat) {
  // Update active button
  document.querySelectorAll('.cat-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');

  markers.forEach(function(m) {
    if (cat === 'all' || m.options.category === cat) {
      m.addTo(map);
    } else {
      map.removeLayer(m);
    }
  });
}

// Add region labels
var labels = [
  {x: 1000, y: 300, text: '宁姆格福', color: '#7ac77a'},
  {x: 800, y: 1200, text: '啜泣半岛', color: '#7ac77a'},
  {x: 1000, y: 600, text: '利耶尼亚', color: '#6b9bd2'},
  {x: 2200, y: 300, text: '盖利德', color: '#d47a6b'},
  {x: 3400, y: 600, text: '王城罗德尔', color: '#f0c040'},
  {x: 2800, y: 1200, text: '巨人山顶', color: '#c9d1d9'},
  {x: 3800, y: 1800, text: '法则姆·阿兹拉', color: '#d4a6ff'},
  {x: 4000, y: 2400, text: '圣树', color: '#ffaaaa'}
];

labels.forEach(function(l) {
  L.marker([l.y, l.x], {
    icon: L.divIcon({
      className: 'region-label',
      html: '<div style="font-size:16px;font-weight:bold;color:'+l.color+';text-shadow:0 0 8px rgba(0,0,0,0.8);text-align:center;width:120px;">'+l.text+'</div>',
      iconSize: [120, 24],
      iconAnchor: [60, 12]
    })
  }).addTo(map);
});
</script>
</body>
</html>
