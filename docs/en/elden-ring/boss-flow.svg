<svg role="img" viewBox="0 0 680 640" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>Elden Ring 强制Boss完整路线图</title>
  <desc>12个强制Boss按4个阶段排列，4个可选Boss从右侧分支进入</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style>
  </defs>

  <text x="340" y="20" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Elden Ring — 强制Boss路线图</text>

  <rect x="40" y="40" width="600" height="90" rx="10" fill="#F3FBF8" stroke="#9FE1CB" stroke-width="0.5"/>
  <text x="60" y="62" font-size="12" font-weight="500" fill="#085041">Limgrave · Stormveil</text>
  <g><rect x="190" y="55" width="200" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="290" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">Margit, the Fell Omen</text></g>
  <g><rect x="190" y="97" width="200" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="290" y="113" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">Godrick the Grafted</text></g>
  <line x1="290" y1="87" x2="290" y2="95" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="40" y="140" width="600" height="180" rx="10" fill="#F3F7FC" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="60" y="162" font-size="12" font-weight="500" fill="#0C447C">Liurnia · Altus Plateau</text>
  <g><rect x="190" y="150" width="200" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
