  <g><rect x="190" y="238" width="200" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="290" y="254" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">Godfrey, First Elden Lord</text></g>
  <g><rect x="190" y="282" width="200" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
