  <g><rect x="425" y="243" width="150" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4,2"/>
    <text x="500" y="259" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">Rykard, Lord of Blasphemy</text></g>
  <g><rect x="445" y="385" width="150" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4,2"/>
    <text x="520" y="401" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">Mohg, Lord of Blood</text></g>
  <g><rect x="445" y="495" width="150" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4,2"/>
    <text x="520" y="511" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">Malenia, Blade of Miquella</text></g>
  <line x1="390" y1="166" x2="423" y2="171" stroke="#888780" stroke-width="0.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="390" y1="254" x2="423" y2="259" stroke="#888780" stroke-width="0.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="390" y1="400" x2="443" y2="401" stroke="#888780" stroke-width="0.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="390" y1="444" x2="443" y2="511" stroke="#888780" stroke-width="0.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <text x="60" y="630" font-size="12" fill="#5F5E5A">各阶段连接线 → 强制Boss    </text>
  <line x1="220" y1="626" x2="260" y2="626" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="268" y="630" font-size="12" fill="#5F5E5A"> 可选Boss（不影响通关）</text>
</svg>