  <line x1="290" y1="416" x2="290" y2="426" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="40" y="480" width="600" height="130" rx="10" fill="#FCF6F6" stroke="#F5C4B3" stroke-width="0.5"/>
  <text x="60" y="502" font-size="12" font-weight="500" fill="#712B13">Ashen Capital · Erdtree</text>
  <g><rect x="190" y="490" width="200" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="290" y="506" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#712B13">Sir Gideon Ofnir</text></g>
  <g><rect x="190" y="534" width="200" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="290" y="550" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#712B13">Godfrey / Hoarah Loux</text></g>
  <g><rect x="175" y="578" width="230" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="290" y="594" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#712B13">Radagon + Elden Beast</text></g>
  <line x1="290" y1="522" x2="290" y2="532" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="290" y1="566" x2="290" y2="576" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow)"/>

  <g><rect x="425" y="155" width="150" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4,2"/>
