<svg role="img" viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>塞尔达传说王国之泪神庙分布图</title>
  <desc>152座神庙按区域分布：120座地表 + 32座天空，含大空岛4座初始神庙</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style>

  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">塞尔达传说 王国之泪 — 神庙分布 (共152座)</text>

  <g><text x="130" y="66" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">Central Hyrule</text><rect x="140" y="56" width="300" height="20" rx="4" fill="#C0DD97"/><rect x="440" y="56" width="60" height="20" rx="4" fill="#85B7EB"/><text x="510" y="66" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">20+4 = 24</text></g>
  <g><text x="130" y="96" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">Hebra</text><rect x="140" y="86" width="270" height="20" rx="4" fill="#C0DD97"/><rect x="410" y="86" width="90" height="20" rx="4" fill="#85B7EB"/><text x="510" y="96" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">18+6 = 24</text></g>
  <g><text x="130" y="126" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">Necluda</text><rect x="140" y="116" width="255" height="20" rx="4" fill="#C0DD97"/><rect x="395" y="116" width="60" height="20" rx="4" fill="#85B7EB"/><text x="465" y="126" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">17+4 = 21</text></g>
  <g><text x="130" y="156" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">Lanayru</text><rect x="140" y="146" width="225" height="20" rx="4" fill="#C0DD97"/><rect x="365" y="146" width="45" height="20" rx="4" fill="#85B7EB"/><text x="420" y="156" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">15+3 = 18</text></g>
  <g><text x="130" y="186" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">Gerudo</text><rect x="140" y="176" width="210" height="20" rx="4" fill="#C0DD97"/><rect x="350" y="176" width="45" height="20" rx="4" fill="#85B7EB"/><text x="405" y="186" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">14+3 = 17</text></g>
  <g><text x="130" y="216" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">Eldin</text><rect x="140" y="206" width="195" height="20" rx="4" fill="#C0DD97"/><rect x="335" y="206" width="45" height="20" rx="4" fill="#85B7EB"/><text x="390" y="216" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">13+3 = 16</text></g>
  <g><text x="130" y="246" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">Faron</text><rect x="140" y="236" width="195" height="20" rx="4" fill="#C0DD97"/><rect x="335" y="236" width="45" height="20" rx="4" fill="#85B7EB"/><text x="390" y="246" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">13+3 = 16</text></g>
  <g><text x="130" y="276" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">Akkala</text><rect x="140" y="266" width="180" height="20" rx="4" fill="#C0DD97"/><rect x="320" y="266" width="45" height="20" rx="4" fill="#85B7EB"/><text x="375" y="276" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">12+3 = 15</text></g>
  <g><text x="130" y="306" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">Great Sky Isl.</text><rect x="140" y="296" width="0" height="20" rx="4"/><rect x="140" y="296" width="60" height="20" rx="4" fill="#85B7EB"/><text x="210" y="306" dominant-baseline="central" font-size="12" font-weight="500" fill="#5F5E5A">0+4 = 4</text></g>

  <g transform="translate(140,340)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#C0DD97"/>
    <text x="20" y="10" dominant-baseline="central" font-size="12" fill="#5F5E5A">地表神庙 (120座)</text>
    <rect x="140" y="0" width="14" height="14" rx="3" fill="#85B7EB"/>
    <text x="160" y="10" dominant-baseline="central" font-size="12" fill="#5F5E5A">天空神庙 (32座)</text>
    <text x="320" y="10" dominant-baseline="central" font-size="12" fill="#888780">地面+天空=合计</text>
  </g>

  <text x="140" y="372" font-size="11" fill="#888780">0</text>
  <line x1="155" y1="368" x2="495" y2="368" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="290" y="372" font-size="11" fill="#888780" text-anchor="middle">10座</text>
  <text x="440" y="372" font-size="11" fill="#888780" text-anchor="middle">20座</text>
</svg>