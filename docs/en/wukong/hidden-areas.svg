<svg role="img" viewBox="0 0 680 270" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>黑神话悟空隐藏区域路线图</title>
  <desc>五个章节对应的隐藏区域及其解锁条件，所有区域完成后可挑战二郎神解锁真结局</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">黑神话悟空 — 隐藏区域路线图</text>

  <g class="node c-purple">
    <rect x="65" y="40" width="70" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="100" y="58" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">第一章</text>
  </g>
  <g class="node c-purple">
    <rect x="185" y="40" width="70" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="220" y="58" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">第二章</text>
  </g>
  <g class="node c-purple">
    <rect x="305" y="40" width="70" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">第三章</text>
  </g>
  <g class="node c-purple">
    <rect x="425" y="40" width="70" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="460" y="58" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">第四章</text>
  </g>
  <g class="node c-purple">
    <rect x="545" y="40" width="70" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="580" y="58" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">第五章</text>
  </g>

  <line x1="135" y1="58" x2="179" y2="58" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="255" y1="58" x2="299" y2="58" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="375" y1="58" x2="419" y2="58" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="495" y1="58" x2="539" y2="58" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="100" y1="76" x2="100" y2="94" stroke="#888780" stroke-width="0.5"/>
  <line x1="220" y1="76" x2="220" y2="94" stroke="#888780" stroke-width="0.5"/>
  <line x1="460" y1="76" x2="460" y2="94" stroke="#888780" stroke-width="0.5"/>
  <line x1="580" y1="76" x2="580" y2="94" stroke="#888780" stroke-width="0.5"/>

  <g class="node c-teal">
    <rect x="30" y="96" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="100" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">古观音禅寺</text>
    <text x="100" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1D9E75">敲响三口钟</text>
  </g>

  <g class="node c-blue">
    <rect x="150" y="96" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="220" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">斯哈哩国</text>
    <text x="220" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#378ADD">黄袍员外支线</text>
  </g>

  <g class="node c-pink">
    <rect x="390" y="96" width="140" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
    <text x="460" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#72243E">紫云山</text>
    <text x="460" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D4537E">击败毒敌大王</text>
  </g>

  <g class="node c-amber">
    <rect x="510" y="96" width="140" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="580" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">璧水洞</text>
    <text x="580" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#EF9F27">牛魔王支线</text>
  </g>

  <polyline points="100,152 100,178 340,178 340,184" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <polyline points="220,152 220,178 340,178" fill="none" stroke="#888780" stroke-width="0.5"/>
  <polyline points="460,152 460,178 340,178" fill="none" stroke="#888780" stroke-width="0.5"/>
  <polyline points="580,152 580,178 340,178" fill="none" stroke="#888780" stroke-width="0.5"/>
  <line x1="340" y1="76" x2="340" y2="184" stroke="#888780" stroke-width="0.5" stroke-dasharray="4,4"/>

  <g class="node c-coral">
    <rect x="230" y="186" width="220" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="340" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">梅山 · 二郎神 (真结局)</text>
    <text x="340" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#D85A30">需完成以上四个隐藏区域 + 推进至第三章</text>
  </g>
</svg>